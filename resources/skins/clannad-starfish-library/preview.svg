<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110d1b"/>
      <stop offset="55%" stop-color="#221738"/>
      <stop offset="100%" stop-color="#3c2149"/>
    </linearGradient>
    <linearGradient id="windowRay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dusk)"/>
  <polygon points="420,0 620,0 380,360 190,360" fill="url(#windowRay)"/>
  <!-- 五线谱悠扬弦波 -->
  <g stroke="#c084fc" stroke-opacity="0.26" stroke-width="1.4">
    <path d="M0 220 Q200 175 400 225 T640 195"/>
    <path d="M0 234 Q200 189 400 239 T640 209"/>
    <path d="M0 248 Q200 203 400 253 T640 223"/>
  </g>
  <!-- 风子的纪念木雕海星 -->
  <g transform="translate(455, 195) rotate(-12)">
    <path d="M50 6 L63 36 L95 40 L71 62 L78 94 L50 78 L22 94 L29 62 L5 40 L37 36 Z" fill="#fb923c" stroke="#fed7aa" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="43" cy="48" r="2.6" fill="#431407"/>
    <circle cx="57" cy="48" r="2.6" fill="#431407"/>
    <path d="M45 57 Q50 62 55 57" stroke="#431407" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- 星芒点缀 -->
  <g fill="#e9d5ff" opacity="0.75">
