<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cyberGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cybernetic Robot Head -->
  <rect x="40" y="45" width="120" height="110" rx="28" fill="#1E293B" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#cyberGlow)" />
  <!-- Visor -->
  <rect x="55" y="70" width="90" height="35" rx="14" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
  <!-- Neon Eyes -->
  <circle cx="80" cy="87" r="7" fill="#00F0FF" />
  <circle cx="120" cy="87" r="7" fill="#00F0FF" />
  <!-- Cyber Antenna -->
  <line x1="100" y1="45" x2="100" y2="25" stroke="#06B6D4" stroke-width="3" />
  <circle cx="100" cy="20" r="5" fill="#3B82F6" />
  <!-- LED Mouth -->
  <line x1="85" y1="125" x2="115" y2="125" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
</svg>
