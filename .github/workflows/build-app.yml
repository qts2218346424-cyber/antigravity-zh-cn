name: 构建一体化管理器 (Build Manager App)

# 只构建并上传为 Actions Artifact，不创建 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'app-v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        run: python -m pip install pytest pillow pyyaml
      - name: 材质包 / 注入 / 自动重注入测试（含 Xvfb 图形界面冒烟）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk >/dev/null
          xvfb-run -a python -m pytest -q tests/test_skin_manifest.py tests/test_skin_injection.py tests/test_agzh_app.py tests/test_polish_fixes.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AntigravityZhCN-windows-x64
          - os: macos-latest
            artifact: AntigravityZhCN-macos
          - os: ubuntu-latest
            artifact: AntigravityZhCN-linux-x64
    runs-on: ${{ matrix.os }}
    # Windows 为主要目标；macOS / Linux 构建失败不影响 Windows 产物
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装打包依赖
        run: python -m pip install -r packaging/requirements-app.txt
      - name: Windows 图形界面冒烟测试
        if: runner.os == 'Windows'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_agzh_app.py
      - name: PyInstaller 打包
        run: python packaging/build_exe.py
      - name: 打包产物自检（命令行模式）
        if: runner.os != 'macOS'
        shell: bash
        env:
          AGZH_CONFIG_DIR: ${{ runner.temp }}/agzh-selftest
        run: |
          EXE=dist/AntigravityZhCN
          [ -f dist/AntigravityZhCN.exe ] && EXE=dist/AntigravityZhCN.exe
          ls -la dist
          # console=False 的程序在 Windows 上没有标准输出，这里只检查退出码与配置目录内容
          "$EXE" cli skin use sakura-light
          test -f "$AGZH_CONFIG_DIR/compiled/active-skin.json"
          test -d "$AGZH_CONFIG_DIR/skins/nezuko-bamboo"
          # 多媒体助手模式：打过补丁的 Antigravity 会以管道调用 “exe --media status”，必须输出一行 JSON
          "$EXE" --media status > media.json
          cat media.json
          python -c "import json; d = json.loads(open('media.json', encoding='utf-8').read().strip().splitlines()[-1]); assert 'isPlaying' in d, d"
          python -c "import os, glob; [print(f'{p}: {os.path.getsize(p) / 1024 / 1024:.2f} MB') for p in glob.glob('dist/AntigravityZhCN*') if os.path.isfile(p)]"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/AntigravityZhCN.exe
            dist/AntigravityZhCN
            dist/AntigravityZhCN.app
          if-no-files-found: error
          retention-days: 30
