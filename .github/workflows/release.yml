name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### ⚡ 极客性能压榨与系统治理套件（深度集成）
            - **桌宠灵动岛第 3 悬浮舱 (`PetOptimizerHud`)**：在桌面伴侣灵动岛中深度嵌入极客压榨舱，悬浮直观监控物理内存与 Commit 压力、前台 VIP 进程，支持一键切换「极客霸权模式」、一键清除 Standby 内存与后台瘦身、TOP 进程一键冻结与全部解冻。
            - **Studio 完整治理控制台 (`OptimizerTab`)**：新增第 8 选项卡，提供内存与进程组聚合治理、Windows / 华硕高耗服务一键启停（MSSQLSERVER、SysMain、WSearch、DiagTrack、ArmouryCrate 等）、缓存清理与大文件回收站安全治理。
            - **原生四重核隔离与自私调度引擎**：开启极客霸权模式后，非白名单后台进程自动驱逐至末位逻辑核心（如 16 线程机型的 CPU 14-15，腾空 CPU 0-13 主算力），降为 IDLE 优先级、开启 EcoQoS 节能限频并压制内存与 I/O 优先级；前台焦点窗口自动拉升为全核高优先级 VIP。
            - **严格白名单与 6 层子进程树免疫**：内置代理网络全家桶（FlClash、Clash、Mihomo、V2Ray、Xray、Sing-box、Tailscale 等）、Antigravity 全家桶与 Windows 内核级进程免杀；最高 6 层祖先树追踪使得 Antigravity 自主派生的子进程自动继承免疫，杜绝代理断连与开发卡顿。
            - **系统级时钟与安全护栏**：支持 0.5ms 系统高精度时钟、菜单响应零延迟（MenuShowDelay = 0）与 Core Parking 禁用；支持基于 ntdll 动态解析的进程挂起（CPU 归零）与解冻，退出时全量自动恢复；大文件清理支持 Windows 安全回收站与系统目录防删护栏。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
