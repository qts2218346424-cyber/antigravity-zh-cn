name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### ✨ 核心亮点与视觉升级
            - **重构暗色光学皮肤引擎（7 款深色材质全面焕新）**：全量对接官方客户端 `Onyx` + Tailwind v4 原生设计令牌（`--onyx-*`、`--shell`、`--glass` 等），彻底消除浅色宿主下开启黑色材质出现的惨白方块与代码高亮撕裂；移除顶层前景噪点与水印雾化层，改为底层画布光学合成与柔和天光晕染，重调五阶明度梯度并升级超清无损 SVG 矢量星轨与无缝麻叶晶格。
            - **全套 10 款材质包融入《CLANNAD》水彩角色与团子图标体系**：全系内置专属团子主徽标、功能语义图标与输入舱伴读微章挂件。
            - **修复 Studio 材质预览器渲染细节**：解决「光学精调」实验室中卡片通透度导致内部文字一并发虚的问题，优化画廊微缩视窗层次。

            ### 🐛 问题修复
            - **修复老宠物残留检测自指误报**：修正客户端哨兵在扫描 `preload.js` 时误匹配新版自身清理列表字面量，消除顶栏反复弹出「检测到客户端旧版老宠物残留」横幅的问题。
            - **自动更新体验加固**：构建期采用预发布隔离，待 Windows / macOS / Linux 全平台安装包与 `updater.json` 签名索引全部就绪后原子切换为正式最新版。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
