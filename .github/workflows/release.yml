name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### 🎨 UI 布局修复：根治长文本导致的图标覆盖与溢出屏幕
            - **全局导航栏与多语言容错**：为顶部图文/图标胶囊导航补充 `min-w-0`、横向容错滚动与右侧设置区 `shrink-0` 锁定，彻底杜绝宽屏/窄屏及英文、俄文等长文案下导航项向两侧冲出覆盖图标或将右侧按钮挤出窗口的问题。
            - **核心页面工具栏与卡片防挤压**：全面加固仪表盘、账号管理、API 反代、流量日志、Token 统计、设置、Studio 工作台、极速压榨与治理面板及迷你悬浮窗的 `flex-wrap`、文本截断 (`truncate` + `title` 悬浮完整文案) 与图标/徽章 `shrink-0` 防护。
            - **清理历史废弃旧代码**：移除已不再使用的旧组件文件（`AccountRow.tsx`、`NetworkMonitor.tsx`、`PinnedQuotaModels.tsx`），保持代码库整洁。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
