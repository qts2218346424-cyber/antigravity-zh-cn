name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### 🎨 顶部导航栏与 UI 响应式彻底重构
            - **重构顶部导航栏阶梯响应式架构**：在 `640px - 1239px`（覆盖 1120px 默认主窗口及各类系统 DPI 缩放）采用**智能聚焦胶囊**（当前激活模块完整展开图文标识，其余模块呈现精致图标与悬停 Tooltip，总宽控制在 ~400px）；在 `≥ 1240px` 宽屏下自动舒展展示全文字胶囊。
            - **稳固品牌 Logo 呈现**：移除脆弱的 `@container/logo` 容器断点与挤压收缩逻辑，确保桌面端 `Antigravity Studio` 品牌标题稳固显示，绝不异常消失。
            - **精简右侧快捷控制区**：优化伴侣、迷你悬浮窗、明暗主题与语言切换按钮尺寸与间距，为中间导航菜单释放充裕呼吸留白，彻底根治菜单「汉化与美化 / 设置」被截断、遮挡与图标贴边挤压的问题。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
