name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### 🚀 深度同步上游 Antigravity-Manager 核心能力（截至最新 Beta）
            - **新模型与配额对齐**：新增支持 **Gemini 4 Carbon** 模型及动态 Gemini 4+ 代号识别；配额面板对齐 Neon 双向木桶约束模型，修复耗尽模型残余字段缺失误显为 100% 的问题。
            - **反代流式协议与自愈加固**：纯思考空回复遵循零正文篡改规范输出 `STOP` 与 `[DONE]`；`MAX_TOKENS` 正常语义截断不再误判中断；修复长思考流 HTTP/2 自适应保活、JSON fence 泄漏、Claude `responseSchema` 降级与 `tool_choice` 自愈，以及上游 1M 上下文超限转译为 Anthropic `prompt is too long`。
            - **WAF 隐身防降智与精细化调度**：注入 `[SYSTEM MANDATE]` 执行锚点缓解长上下文降智，中和多种客户端 WAF 伪 429 风控；支持分模型族/单模型级别账号优先级覆盖与 `Thinking level` 自动降级重试。
            - **官方 Hub / IDE / WSL 生态升级**：官方 Hub 指纹基准升级至 `2.33.0` (CL `1023160026`) 并支持 Hub UA 平台切换；实现 Antigravity IDE 会话状态原子同步无感热切号与免条款弹窗；新增 **WSL 环境凭据同步**、403 一键解限与真实测活错误透出、手动预热弹窗确认。
            - **桌面体验与安全修复**：修复 Windows 轻量模式恢复防死锁、macOS Keychain 缓存冷却、多显示器坐标偏移及 360px 迷你悬浮窗顶栏溢出，同时封堵静态后缀鉴权绕过并强化凭据脱敏。

            ### ✨ 完整保留 Antigravity Studio 定制特性与视觉焕新
            - 🎨 **全新「A 字团子大家族」应用图标**：彻底重绘日系治愈 3D 软糯粘土风格图标（8 颗马卡龙配色团子叠成字母「A」），全平台（Windows `.ico` / macOS `.icns` / Linux / 托盘剪影 / Web）完整换新。
            - 完整保留 8 大 Studio 美化与治理工坊、6+1 角色独立透明桌面伴侣、`Optimizer` 一键 UAC 提权治理、全宽弹性智能聚焦导航栏以及 `latest.json` 专属正式 OTA 自动更新通道。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
