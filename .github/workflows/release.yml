name: 构建并发布 OTA 更新 (Build & Release OTA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v5.0.3）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装前端依赖并执行自动化单元测试、TypeScript 与生产打包校验
        run: |
          npm ci
          npm test
          npm run build

  release-desktop:
    needs: build-frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 安装包并生成 updater.json 签名更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_GCP_CLIENT_ID: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_ID }}
          ANTIGRAVITY_GCP_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_GCP_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Antigravity Studio ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Antigravity Studio ${{ inputs.tag || github.ref_name }} 更新说明

            ### 🎨 深度解决全屏挤占与缩放显示不完整问题
            - **顶栏释放全宽流式布局**：移除顶部导航栏死板的 `max-w-7xl` 居中宽度限制，全屏模式下两端与中间拥有充裕呼吸留白，彻底解决全屏后 Logo、导航与快捷按钮挤在一堆的问题。
            - **单套弹性导航架构，根治媒体查询冲突**：彻底重构导航菜单为单套自适应 `<nav>`（`≥ 768px` 智能聚焦胶囊，激活项完整图文高亮展开，超宽屏 `≥ 1400px` 全文字展开；`< 768px` 自动无损切换为下拉选择器），杜绝多套 DOM 在缩放时互相挤占或截断。
            - **右侧快捷控制区动态收拢**：在视口受限（`< 840px`）或页面缩放放大时，快捷控制按钮自动收纳为紧凑的单枚「更多功能」按钮，为中间菜单额外释放 100px 以上空间。
            - **全站卡片与工坊 Tab 响应式优化**：各页面主体容器升级为 `max-w-7xl 2xl:max-w-[1600px]`，全屏视野更舒展；Studio 8 大子工坊 Tab 开启弹性换行包裹，缩放时每一个子功能均 100% 完整可见。
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  finalize-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 同步生成兼容旧版客户端的 updater.json 并在全平台就绪后原子切换为 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern "latest.json" --clobber
          cp latest.json updater.json
          gh release upload "${TAG}" updater.json --repo "${REPO}" --clobber
          if [[ "${TAG}" != *-* ]]; then
            gh release edit "${TAG}" --repo "${REPO}" --prerelease=false --latest
          fi
